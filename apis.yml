aid: jetzero
name: JetZero
description: 'JetZero is a Long Beach, California aerospace company founded in 2021 by Tom O''Leary and
  Mark Page to bring the blended wing body (all-wing) airframe to commercial aviation. Its flagship program
  is the Z4, a 250-seat, international-range jetliner the company says will burn up to 50% less fuel than
  comparable tube-and-wing airliners, and the Jet1 full-scale demonstrator being built with Scaled Composites
  in Mojave, California ahead of a first flight targeted for 2027. JetZero broke ground in 2026 on a
  manufacturing and final-assembly campus in Greensboro, North Carolina and is opening an engineering
  office in Wichita, Kansas at NIAR. It is backed by the U.S. Air Force, NASA, United Airlines, Alaska
  Star Ventures and a $175M Series B led by B Capital, with letters of intent from Gulf Air and Japan
  Airlines. JetZero is an aircraft manufacturer, not a software or data provider: as of this profile it
  publishes no public developer portal, no API documentation, no SDKs, and no machine-readable API contract
  of any kind. Its public technical surface is a supplier registration and supplier standards program.'
